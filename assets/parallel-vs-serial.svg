<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Parallel speedup versus serial implementation</title>
  <desc id="desc">Parallel speedup across input sizes 256, 512, 1024, 2048, and 4096, reaching 7.49 times at 4096.</desc>
  <rect width="960" height="500" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#24292f; }
    .grid { stroke:#d8dee4; stroke-width:1; }
    .axis { stroke:#57606a; stroke-width:1.4; }
    .bar { fill:#0969da; }
  </style>

  <text x="480" y="34" font-size="22" font-weight="700" text-anchor="middle">Parallel Speedup vs. Serial Implementation</text>
  <text x="480" y="58" font-size="13" text-anchor="middle">4 nodes × 16 MPI processes/node (64 total)</text>

  <line class="grid" x1="90" y1="405" x2="870" y2="405"/>
  <line class="grid" x1="90" y1="364.4" x2="870" y2="364.4"/>
  <line class="grid" x1="90" y1="323.8" x2="870" y2="323.8"/>
  <line class="grid" x1="90" y1="283.1" x2="870" y2="283.1"/>
  <line class="grid" x1="90" y1="242.5" x2="870" y2="242.5"/>
  <line class="grid" x1="90" y1="201.9" x2="870" y2="201.9"/>
  <line class="grid" x1="90" y1="161.3" x2="870" y2="161.3"/>
  <line class="grid" x1="90" y1="120.6" x2="870" y2="120.6"/>
  <line class="grid" x1="90" y1="80" x2="870" y2="80"/>
  <line class="axis" x1="90" y1="80" x2="90" y2="405"/>
  <line class="axis" x1="90" y1="405" x2="870" y2="405"/>

  <g font-size="12" text-anchor="end">
    <text x="76" y="409">0×</text><text x="76" y="369">1×</text><text x="76" y="328">2×</text>
    <text x="76" y="287">3×</text><text x="76" y="247">4×</text><text x="76" y="206">5×</text>
    <text x="76" y="166">6×</text><text x="76" y="125">7×</text><text x="76" y="85">8×</text>
  </g>

  <rect class="bar" x="130" y="344.1" width="100" height="60.9" rx="3"/>
  <rect class="bar" x="285" y="315.6" width="100" height="89.4" rx="3"/>
  <rect class="bar" x="440" y="254.3" width="100" height="150.7" rx="3"/>
  <rect class="bar" x="595" y="179.1" width="100" height="225.9" rx="3"/>
  <rect class="bar" x="750" y="100.7" width="100" height="304.3" rx="3"/>

  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="180" y="336">1.50×</text>
    <text x="335" y="307">2.20×</text>
    <text x="490" y="246">3.71×</text>
    <text x="645" y="171">5.56×</text>
    <text x="800" y="92">7.49×</text>
  </g>

  <g font-size="12" text-anchor="middle">
    <text x="180" y="428">256</text>
    <text x="335" y="428">512</text>
    <text x="490" y="428">1024</text>
    <text x="645" y="428">2048</text>
    <text x="800" y="428">4096</text>
  </g>

  <text x="490" y="450" font-size="12" text-anchor="middle">Input size</text>
  <text x="480" y="476" font-size="13" text-anchor="middle">Larger workloads expose more useful computation relative to MPI overhead.</text>
</svg>
