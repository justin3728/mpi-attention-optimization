<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Optimization speedup relative to MPI baseline</title>
  <desc id="desc">Speedup across input sizes 256, 512, 1024, 2048, and 4096 for AVX-512, mixed precision, pipeline overlap, and the full optimized implementation.</desc>
  <rect width="960" height="500" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#24292f; }
    .grid { stroke:#d8dee4; stroke-width:1; }
    .axis { stroke:#57606a; stroke-width:1.4; }
    .baseline { stroke:#8c959f; stroke-width:1.5; stroke-dasharray:6 5; }
    .avx { stroke:#0969da; fill:none; stroke-width:3; }
    .mixed { stroke:#bf8700; fill:none; stroke-width:3; }
    .pipe { stroke:#cf222e; fill:none; stroke-width:3; }
    .full { stroke:#8250df; fill:none; stroke-width:4; }
    .dot-avx { fill:#0969da; } .dot-mixed { fill:#bf8700; } .dot-pipe { fill:#cf222e; } .dot-full { fill:#8250df; }
  </style>

  <text x="480" y="34" font-size="22" font-weight="700" text-anchor="middle">Optimization Impact vs. MPI Baseline</text>
  <text x="480" y="58" font-size="13" text-anchor="middle">4 nodes × 16 MPI processes/node (64 total)</text>

  <line class="grid" x1="90" y1="405" x2="870" y2="405"/>
  <line class="grid" x1="90" y1="351.7" x2="870" y2="351.7"/>
  <line class="grid" x1="90" y1="298.3" x2="870" y2="298.3"/>
  <line class="grid" x1="90" y1="245" x2="870" y2="245"/>
  <line class="grid" x1="90" y1="191.7" x2="870" y2="191.7"/>
  <line class="grid" x1="90" y1="138.3" x2="870" y2="138.3"/>
  <line class="grid" x1="90" y1="85" x2="870" y2="85"/>
  <line class="baseline" x1="90" y1="351.7" x2="870" y2="351.7"/>
  <line class="axis" x1="90" y1="85" x2="90" y2="405"/>
  <line class="axis" x1="90" y1="405" x2="870" y2="405"/>

  <text x="76" y="410" font-size="12" text-anchor="end">0.5×</text>
  <text x="76" y="356" font-size="12" text-anchor="end">1.0×</text>
  <text x="76" y="303" font-size="12" text-anchor="end">1.5×</text>
  <text x="76" y="250" font-size="12" text-anchor="end">2.0×</text>
  <text x="76" y="197" font-size="12" text-anchor="end">2.5×</text>
  <text x="76" y="143" font-size="12" text-anchor="end">3.0×</text>
  <text x="76" y="90" font-size="12" text-anchor="end">3.5×</text>

  <g font-size="12" text-anchor="middle">
    <text x="170" y="428">256</text>
    <text x="330" y="428">512</text>
    <text x="490" y="428">1024</text>
    <text x="650" y="428">2048</text>
    <text x="810" y="428">4096</text>
  </g>
  <text x="490" y="450" font-size="12" text-anchor="middle">Input size</text>

  <polyline class="avx" points="170,334.6 330,320.8 490,309.0 650,312.2 810,309.0"/>
  <polyline class="mixed" points="170,351.7 330,349.5 490,357.0 650,375.1 810,374.1"/>
  <polyline class="pipe" points="170,359.1 330,357.0 490,354.9 650,363.4 810,363.4"/>
  <polyline class="full" points="170,311.1 330,273.8 490,221.5 650,161.8 810,105.3"/>

  <g>
    <circle class="dot-avx" cx="170" cy="334.6" r="4"/><circle class="dot-avx" cx="330" cy="320.8" r="4"/><circle class="dot-avx" cx="490" cy="309.0" r="4"/><circle class="dot-avx" cx="650" cy="312.2" r="4"/><circle class="dot-avx" cx="810" cy="309.0" r="4"/>
    <circle class="dot-mixed" cx="170" cy="351.7" r="4"/><circle class="dot-mixed" cx="330" cy="349.5" r="4"/><circle class="dot-mixed" cx="490" cy="357.0" r="4"/><circle class="dot-mixed" cx="650" cy="375.1" r="4"/><circle class="dot-mixed" cx="810" cy="374.1" r="4"/>
    <circle class="dot-pipe" cx="170" cy="359.1" r="4"/><circle class="dot-pipe" cx="330" cy="357.0" r="4"/><circle class="dot-pipe" cx="490" cy="354.9" r="4"/><circle class="dot-pipe" cx="650" cy="363.4" r="4"/><circle class="dot-pipe" cx="810" cy="363.4" r="4"/>
    <circle class="dot-full" cx="170" cy="311.1" r="5"/><circle class="dot-full" cx="330" cy="273.8" r="5"/><circle class="dot-full" cx="490" cy="221.5" r="5"/><circle class="dot-full" cx="650" cy="161.8" r="5"/><circle class="dot-full" cx="810" cy="105.3" r="5"/>
  </g>

  <text x="820" y="97" font-size="14" font-weight="700">3.31×</text>

  <g font-size="12">
    <line class="avx" x1="125" y1="480" x2="155" y2="480"/><text x="163" y="484">AVX-512</text>
    <line class="mixed" x1="270" y1="480" x2="300" y2="480"/><text x="308" y="484">Mixed precision</text>
    <line class="pipe" x1="445" y1="480" x2="475" y2="480"/><text x="483" y="484">Pipeline overlap</text>
    <line class="full" x1="625" y1="480" x2="655" y2="480"/><text x="663" y="484">Full optimized</text>
  </g>
</svg>
