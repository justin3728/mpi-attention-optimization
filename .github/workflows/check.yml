name: Build and correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MPI
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - name: Compile all paths
        run: make all attention-mpi-scatter
      - name: Check serial and available SIMD execution
        env:
          OMPI_MCA_rmaps_base_oversubscribe: '1'
        run: |
          if grep -qw avx512f /proc/cpuinfo && grep -qw fma /proc/cpuinfo; then
            python3 tests/smoke.py
          else
            python3 tests/smoke.py --serial-only
            echo 'MPI binaries compiled; execution skipped because this runner lacks AVX-512F/FMA.' >> "$GITHUB_STEP_SUMMARY"
          fi
